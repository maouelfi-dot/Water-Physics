name: Build dar water.zip
on:
  push:
    paths:
      - 'water.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ekstrak water.zip
        run: |
          rm -rf src
          mkdir src
          unzip -q water.zip -d src
          BUILD_FILE=$(find src -maxdepth 4 -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "GAK ADA build.gradle, isi zip-nya bukan source mod!"
            exit 1
          fi
          D=$(dirname "$BUILD_FILE")
          if [ "$D" != "src" ]; then
            mv "$D" src_real && rm -rf src && mv src_real src
          fi
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Auto-fix compile errors
        working-directory: src
        run: |
          python3 - << 'PY'
          import pathlib, re

          # --- FIX 1: tambah treeMaxLeaves di WaveConfig.java ---
          for p in pathlib.Path("src/main/java").rglob("WaveConfig.java"):
              t = p.read_text()
              if "treeMaxLeaves" not in t:
                  t = t.replace("{", "{\n    public int treeMaxLeaves = 200;", 1)
                  p.write_text(t)

          # --- FIX 2: gabungin deklarasi dobel di WaveMath.java ---
          for p in pathlib.Path("src/main/java").rglob("WaveMath.java"):
              lines = p.read_text().splitlines()
              decl_idx = []
              all_vars = []
              for i, line in enumerate(lines):
                  if "private static final double[]" in line:
                      decl_idx.append(i)
                      for v in re.findall(r'([A-Z_][A-Z0-9_]*)\s*=', line):
                          if v not in all_vars:
                              all_vars.append(v)
              if len(decl_idx) > 1:
                  merged = "    private static final double[] " + ", ".join([f"{v} = new double[N]" for v in all_vars]) + ";"
                  new_lines = []
                  inserted = False
                  for i, line in enumerate(lines):
                      if i in decl_idx:
                          if not inserted:
                              new_lines.append(merged)
                              inserted = True
                          continue
                      new_lines.append(line)
                  p.write_text("\n".join(new_lines) + "\n")

          # --- FIX 3: CameraSubmersionType di OceanRenderer.java ---
          for p in pathlib.Path("src").rglob("OceanRenderer.java"):
              lines = p.read_text().splitlines()
              out = []
              for line in lines:
                  # buang import yang salah
                  if "import" in line and "CameraSubmersionType" in line:
                      continue
                  # kalau ada baris boolean under yang pake CameraSubmersionType, ganti total 1 baris bersih
                  if "boolean under" in line and "getSubmersionType" in line:
                      indent = line[:len(line) - len(line.lstrip())]
                      out.append(indent + 'boolean under = ctx.camera().getSubmersionType().toString().equals("WATER");')
                      continue
                  # kalau masih ada sisa CameraSubmersionType di baris lain, ganti jadi String "WATER"/"LAVA" dll
                  if "CameraSubmersionType" in line:
                      line = re.sub(r'CameraSubmersionType\.([A-Z_]+)', r'"\1"', line)
                      line = line.replace("CameraSubmersionType", "String")
                  out.append(line)
              p.write_text("\n".join(out) + "\n")
              print("FIX OceanRenderer done")
          print("auto-fix done")
          PY

      - name: Build
        working-directory: src
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: waterphysics-fabric-1.21.1
          path: src/build/libs/*.jar
