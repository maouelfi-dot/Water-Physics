name: Build dar water.zip
on:
  push:
    paths:
      - 'water.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ekstrak water.zip
        run: |
          rm -rf src
          mkdir src
          unzip -q water.zip -d src
          BUILD_FILE=$(find src -maxdepth 4 -name "build.gradle*" | head -n 1)
          D=$(dirname "$BUILD_FILE")
          if [ "$D" != "src" ]; then
            mv "$D" src_real && rm -rf src && mv src_real src
          fi
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build
        working-directory: src
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: waterphysics-fabric-1.21.1
          path: src/build/libs/*.jar
