name: Build dar water.zip
on:
  push:
    paths:
      - 'water.zip'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Ekstrak water.zip
        run: |
          rm -rf src
          mkdir src
          unzip -q water.zip -d src
          BUILD_FILE=$(find src -maxdepth 4 -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "GAK ADA build.gradle, isi zip-nya bukan source mod!"
            exit 1
          fi
          D=$(dirname "$BUILD_FILE")
          if [ "$D" != "src" ]; then
            mv "$D" src_real && rm -rf src && mv src_real src
          fi
          ls -la src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Auto-fix compile errors
        working-directory: src
        run: |
          python3 - << 'PY'
          import pathlib, re

          # --- FIX 1: tambah treeMaxLeaves di WaveConfig.java ---
          for p in pathlib.Path("src/main/java").rglob("WaveConfig.java"):
              t = p.read_text()
              if "treeMaxLeaves" not in t:
                  t = t.replace("{", "{\n    public int treeMaxLeaves = 200;", 1)
                  p.write_text(t)
                  print(f"FIX WaveConfig: tambah treeMaxLeaves di {p}")

          # --- FIX 2: gabungin deklarasi dobel di WaveMath.java ---
          for p in pathlib.Path("src/main/java").rglob("WaveMath.java"):
              lines = p.read_text().splitlines()
              # cari semua baris deklarasi array double
              decl_idx = []
              all_vars = []
              for i, line in enumerate(lines):
                  if "private static final double[]" in line:
                      decl_idx.append(i)
                      # ambil nama variabelnya: KX, KZ, KK, LAMBDA, MODX, dll
                      vars_in_line = re.findall(r'([A-Z_][A-Z0-9_]*)\s*=', line)
                      for v in vars_in_line:
                          if v not in all_vars:
                              all_vars.append(v)
              if len(decl_idx) > 1:
                  print(f"FIX WaveMath: ketemu {len(decl_idx)} deklarasi dobel, variabel: {all_vars}")
                  # bikin 1 baris gabungan
                  merged = "    private static final double[] " + ", ".join([f"{v} = new double[N]" for v in all_vars]) + ";"
                  # hapus semua baris deklarasi lama, sisipkan yang gabungan di posisi pertama
                  new_lines = []
                  inserted = False
                  for i, line in enumerate(lines):
                      if i in decl_idx:
                          if not inserted:
                              new_lines.append(merged)
                              inserted = True
                          continue
                      new_lines.append(line)
                  p.write_text("\n".join(new_lines) + "\n")
                  print(f"FIX WaveMath: digabung jadi -> {merged}")
          print("auto-fix done")
          PY

      - name: Build
        working-directory: src
        run: gradle build --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: waterphysics-fabric-1.21.1
          path: src/build/libs/*.jar
