name: Build dari water.zip
on:
  push:
    paths:
      - 'water.zip'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ekstrak water.zip
        run: |
          mkdir src
          unzip -q water.zip -d src
          # kalau isi zip ada di dalam 1 folder, masuk ke folder itu
          if [ ! -f src/build.gradle ]; then
            d=$(dirname "$(find src -maxdepth 3 -name build.gradle | head -n1)")
            mv "$d" src_real && rm -rf src && mv src_real src
          fi
          ls -la src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        working-directory: src
        run: gradle build --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: waterphysics-fabric-1.21.1
          path: src/build/libs/*.jar
